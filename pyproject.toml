[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysdm"
version = "0.1.0"
description = "Sequential decision modeling under uncertainty (Powell's Universal Modeling Framework)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lucas Matni" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy", "pandas>=2.0", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pysdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
